backend:
  name: github
  repo: "kimmyenn2005-sudo/iphonequangngai"
  branch: main
  use_graphql: true
  # Dang nhap qua Worker rieng cua HV Mobile tren Cloudflare.
  # (Truoc day dung dich vu cua Netlify, da khong con dung nua.)
  base_url: "https://hv-cms-auth.hvmobile43-vn.workers.dev"
  auth_endpoint: "auth"

locale: vi
site_url: "https://iphonequangngai.hvmobile43-vn.workers.dev"
display_url: "https://iphonequangngai.hvmobile43-vn.workers.dev"
logo_url: "https://iphonequangngai.hvmobile43-vn.workers.dev/hv-mobile-google-192.png"
publish_mode: simple
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "bang-gia"
    label: "Quản trị bảng giá"
    delete: false
    editor:
      preview: false
    files:
      - label: "Bảng giá iPhone"
        name: "gia-iphone"
        file: "content/prices/iphone.json"
        format: "json"
        fields:
          - { label: "Ngày cập nhật", name: "updated_at", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
          - label: "Các dòng iPhone"
            name: "models"
            widget: "list"
            label_singular: "Sản phẩm iPhone mới"
            summary: "{{fields.name}}"
            collapsed: true
            allow_add: true
            allow_remove: true
            allow_reorder: true
            add_to_top: true
            fields:
              - { label: "Tên máy", name: "name", widget: "string", hint: "Ví dụ: iPhone 18 Pro" }
              - { label: "Mã đường dẫn", name: "slug", widget: "string", required: false, hint: "Có thể để trống khi thêm máy mới; website sẽ tự tạo mã từ tên máy." }
              - { label: "Từ khóa tìm kiếm", name: "search", widget: "string", required: false, hint: "Có thể để trống; website sẽ tự dùng tên máy để tìm kiếm." }
              - { label: "Hiển thị trên website", name: "visible", widget: "boolean", default: true, hint: "Tắt để ẩn hoàn toàn sản phẩm khỏi website." }
              - { label: "Còn hàng", name: "in_stock", widget: "boolean", default: true, required: false, hint: "Tắt khi sản phẩm hết hàng; sản phẩm vẫn hiện nhưng có nhãn TẠM HẾT HÀNG." }
              - { label: "Ghi chú sản phẩm (không bắt buộc)", name: "note", widget: "text", required: false, hint: "Ví dụ: hàng đẹp, bản VN/A, màu đang về..." }
              - { label: "THÔNG TIN CHI TIẾT — Ảnh chính", name: "image", widget: "image", required: false, hint: "Không bắt buộc. Dùng khi chỉ muốn đăng 1 ảnh chính." }
              - label: "THÔNG TIN CHI TIẾT — Thư viện ảnh sản phẩm"
                name: "images"
                widget: "list"
                required: false
                allow_add: true
                allow_remove: true
                field: { label: "Ảnh", name: "image", widget: "image" }
                hint: "Có thể thêm nhiều ảnh cho phần Xem chi tiết. Nếu để trống, website vẫn dùng ảnh chính hoặc bộ ảnh có sẵn."
              - { label: "THÔNG TIN CHI TIẾT — Năm ra mắt", name: "year", widget: "string", required: false, hint: "Hiện ở mục Xem chi tiết của sản phẩm. Ví dụ: 2026" }
              - { label: "THÔNG TIN CHI TIẾT — Màn hình", name: "display", widget: "text", required: false, hint: "Hiện ở mục Xem chi tiết. Ví dụ: 6.3 inch Super Retina XDR OLED ProMotion 120Hz" }
              - { label: "THÔNG TIN CHI TIẾT — Chip xử lý", name: "chip", widget: "string", required: false, hint: "Hiện ở mục Xem chi tiết. Ví dụ: A20 Pro" }
              - { label: "THÔNG TIN CHI TIẾT — Camera", name: "camera", widget: "text", required: false, hint: "Hiện ở mục Xem chi tiết. Mô tả camera chính, góc rộng, tele, camera trước..." }
              - { label: "THÔNG TIN CHI TIẾT — Chất liệu hoàn thiện", name: "body", widget: "text", required: false, hint: "Hiện ở mục Xem chi tiết. Ví dụ: khung nhôm, mặt kính Ceramic Shield..." }
              - { label: "THÔNG TIN CHI TIẾT — Cổng kết nối / sạc", name: "port", widget: "text", required: false, hint: "Hiện ở mục Xem chi tiết. Ví dụ: USB-C • MagSafe • 5G" }
              - { label: "THÔNG TIN CHI TIẾT — Kháng nước / bụi", name: "protection", widget: "string", required: false, hint: "Hiện ở mục Xem chi tiết. Ví dụ: IP68" }
              - { label: "THÔNG TIN CHI TIẾT — Điểm nổi bật", name: "highlight", widget: "text", required: false, hint: "Hiện ở mục Xem chi tiết. Nhập các điểm nổi bật chính của máy." }
              - label: "THÔNG TIN CHI TIẾT — Màu sắc"
                name: "colors"
                widget: "list"
                required: false
                summary: "{{fields.name}}"
                fields:
                  - { label: "Tên màu", name: "name", widget: "string" }
                  - { label: "Mã màu", name: "hex", widget: "string", required: false, hint: "Ví dụ #d4af37. Có thể để trống." }
              - label: "THÔNG TIN CHI TIẾT — Dung lượng và giá"
                name: "rows"
                widget: "list"
                summary: "{{fields.storage}} — 99%: {{fields.price_99}}"
                fields:
                  - { label: "Dung lượng", name: "storage", widget: "string" }
                  - { label: "Giá hàng 95%", name: "price_95", widget: "string", hint: "Ví dụ 10.500.000đ; nhập - nếu chưa có giá." }
                  - { label: "Giá hàng 99%", name: "price_99", widget: "string" }
                  - { label: "Giá Like New", name: "price_like_new", widget: "string" }

      - label: "Giá thu cũ"
        name: "gia-thu-cu"
        file: "content/prices/tradein.json"
        format: "json"
        fields:
          - { label: "Ngày cập nhật", name: "updated_at", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
          - label: "Các dòng iPhone thu cũ"
            name: "models"
            widget: "list"
            summary: "{{fields.name}}"
            collapsed: true
            fields:
              - { label: "Tên máy", name: "name", widget: "string" }
              - { label: "Từ khóa tìm kiếm", name: "search", widget: "string" }
              - { label: "Hiển thị trên website", name: "visible", widget: "boolean", default: true }
              - label: "Dung lượng và giá thu"
                name: "rows"
                widget: "list"
                summary: "{{fields.storage}} — {{fields.price}}"
                fields:
                  - { label: "Dung lượng", name: "storage", widget: "string" }
                  - { label: "Giá thu", name: "price", widget: "string", hint: "Nhập - nếu chưa có giá." }

      - label: "Bảng giá phụ kiện"
        name: "gia-phu-kien"
        file: "content/prices/accessories.json"
        format: "json"
        fields:
          - { label: "Ngày cập nhật", name: "updated_at", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
          - label: "Sản phẩm phụ kiện"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            collapsed: true
            fields:
              - { label: "Mã sản phẩm", name: "id", widget: "string", hint: "Không đổi mã này." }
              - { label: "Tên sản phẩm", name: "name", widget: "string" }
              - { label: "Giá bán", name: "price", widget: "string" }
              - { label: "Tình trạng", name: "status", widget: "select", options: ["Còn hàng", "Tạm hết hàng", "Liên hệ"] }
              - { label: "Hiển thị trên website", name: "visible", widget: "boolean", default: true }

      - label: "Giá sửa chữa"
        name: "gia-sua-chua"
        file: "content/prices/repairs.json"
        format: "json"
        fields:
          - { label: "Ngày cập nhật", name: "updated_at", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
          - label: "Các dòng máy sửa chữa"
            name: "services"
            widget: "list"
            summary: "{{fields.model}}"
            collapsed: true
            fields:
              - { label: "Từ khóa tìm kiếm", name: "search", widget: "string" }
              - { label: "Tên máy", name: "model", widget: "string" }
              - { label: "Giá pin", name: "battery", widget: "string" }
              - { label: "Giá màn hình", name: "screen", widget: "string" }
              - { label: "Giá Face ID", name: "face_id", widget: "string" }
              - { label: "Giá lưng", name: "back", widget: "string" }
              - { label: "Giá lên vỏ", name: "frame", widget: "string" }
              - { label: "Hiển thị trên website", name: "visible", widget: "boolean", default: true }

  - name: "bai-viet"
    label: "BÀI VIẾT"
    label_singular: "Bài viết"
    folder: "content/posts"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    editor:
      preview: false
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string", hint: "Nên có từ khóa chính và địa phương, tối đa khoảng 65 ký tự." }
      - { label: "Mô tả Google", name: "description", widget: "text", hint: "Tóm tắt hấp dẫn khoảng 140–160 ký tự." }
      - { label: "Ngày đăng", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Ảnh đại diện", name: "image", widget: "image", required: false, hint: "Ảnh thật tại cửa hàng hoặc ảnh sản phẩm, nên dùng tỷ lệ 16:9." }
      - label: "Chuyên mục"
        name: "category"
        widget: "select"
        options: ["Kinh nghiệm iPhone", "Bảng giá", "Trả góp", "Thu cũ đổi mới", "Sửa chữa", "Tin HV Mobile"]
        default: "Kinh nghiệm iPhone"
      - { label: "Tác giả", name: "author", widget: "string", default: "HV Mobile" }
      - { label: "Ẩn bài viết", name: "draft", widget: "boolean", default: false, required: false, hint: "Bật mục này nếu chưa muốn bài xuất hiện trên website." }
      - { label: "Nội dung", name: "body", widget: "markdown", hint: "Viết tự nhiên, chia tiêu đề rõ ràng và dùng ảnh thật. Không lặp từ khóa quá nhiều." }
